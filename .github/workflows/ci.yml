# Runs the test suite on a fresh checkout of the repository.
#
# The point is the checkout. Everything here already passed locally for months
# while the repo was, on any clone, unimportable: `.gitignore` carried an
# unanchored `data/` rule that also excluded src/pathgrade/data/, and the
# working tree developers ran against still had the files. `actions/checkout`
# is a clone, so a file missing from git makes this job red immediately -
# which is the one signal that was absent.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        # CPU wheels first, from the PyTorch CPU index: this suite never needs
        # a GPU, and letting the extras pull the default CUDA build would add
        # a ~2.5 GB download plus nvidia-* packages. Installing torch and
        # torchvision here means the extras below find them already satisfied.
        #
        # The `extract` extra is installed, not skipped. Its dependencies are
        # not merely optional to the tests: two stub timm.create_model to run
        # the real PatchEncoder against a tiny backbone, and four resolve
        # "openslide.OpenSlide" through monkeypatch, which imports the module
        # even though the class is replaced. openslide-bin ships the native
        # OpenSlide library as a wheel, so no apt install is needed.
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,extract]" openslide-bin

      - name: Checkout is complete
        # Run the packaging guard first and on its own: when a file is missing
        # from git this fails with a message naming the module and pointing at
        # `git check-ignore`, instead of an opaque collection error 200 tests
        # later.
        run: pytest tests/test_packaging.py -q

      - name: Test suite
        # -rs lists skip reasons. Those four openslide tests skip themselves
        # when the extra is missing, which is right for a base install but
        # would be a silent hole here - this makes any skip visible in the log
        # rather than hidden inside a green tick.
        run: pytest -q -rs
