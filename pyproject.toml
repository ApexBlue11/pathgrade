[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathgrade"
version = "0.1.0"
description = "Commercially-clean whole-slide tumour grading: attention-stabilised MIL with an ordinal head"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "h5py>=3.10",
    "scikit-learn>=1.4",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
extract = ["timm>=1.0.9", "torchvision>=0.17", "openslide-python>=1.3", "Pillow>=10.0"]
dev = ["pytest>=8.0"]

[project.scripts]
pathgrade-extract = "pathgrade.preprocessing.extract:main"
pathgrade-train = "pathgrade.train:main"
pathgrade-evaluate = "pathgrade.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
